# Render Blueprint — Phase 2 (API + DB + Redis)
# Web and admin services will be added after Tasks 15-17

services:
  # ── Redis ──────────────────────────────────────────────────────────────
  - type: redis
    name: wingubid-redis
    plan: starter
    ipAllowList: []

  # ── API ────────────────────────────────────────────────────────────────
  - type: web
    name: wingubid-api
    env: node
    plan: starter
    rootDir: .
    buildCommand: >
      npm install -g pnpm &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @betting/types build &&
      pnpm --filter @betting/db build &&
      pnpm --filter api build
    startCommand: node packages/db/dist/migrate.js && node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wingubid-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: wingubid-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: SMS_ENABLED
        value: 'false'
      - key: AT_API_KEY
        value: ''
      - key: AT_USERNAME
        value: sandbox
      - key: CORS_ORIGIN
        value: https://wingubid.onrender.com
      - key: PORT
        value: '10000'

databases:
  - name: wingubid-db
    databaseName: wingubid
    user: wingubid
    plan: starter
