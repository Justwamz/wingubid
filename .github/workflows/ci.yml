name: CI

on:
  push:
    branches: [main, master, feature/phase-2]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @betting/types build
          pnpm --filter @betting/db build

      - name: Run API tests
        run: pnpm --filter api test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-must-be-at-least-32-chars-long!!
          JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-chars-longXXXXX
          ADMIN_JWT_SECRET: test-admin-jwt-secret-at-least-32-chars-longXXX
          SMS_ENABLED: 'false'
          AT_API_KEY: test-key
          AT_USERNAME: sandbox
          PORT: '3001'

      - name: Build API
        run: pnpm --filter api build

      - name: Build web
        run: pnpm --filter web build

      - name: Build admin
        run: pnpm --filter admin build
